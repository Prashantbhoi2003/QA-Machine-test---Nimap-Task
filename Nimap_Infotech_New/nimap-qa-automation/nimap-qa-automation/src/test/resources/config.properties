# ==============================================================
# Environment configuration
# ==============================================================
base.url=https://test.fieldforceconnect.com/
browser=chrome
implicit.wait=10
explicit.wait=30

# ---- Login Page (confirmed from live site) ----
login.username.locator=username
login.password.locator=password
login.submit.locator=//button[@type='submit']

# ---- Dashboard / PunchIn ----
# NOTE: Punch In action could not be located in the web UI for this test
# account after checking Dashboard stats, Attendance page team-member card,
# and Network requests (filtered by "punch" - 0 matching requests found
# out of 3 total requests). Likely mobile-app-only or requires a different
# user role. Documented as a limitation in the submission notes.
punchin.button.locator=//button[contains(text(),'Punch In')]
toast.message.locator=//div[contains(@class,'toast')]

# ---- Add Customer (confirmed from live site) ----
# Flow: sidebar "My Customers" parent link (expands submenu, href="/",
# does NOT navigate) -> click child "My Customer" link (href="/customers")
# -> "Manage" button -> "New Customer" menu option -> form -> Save
addcustomer.menu.locator=//a[.//span[text()='My Customers']]
addcustomer.submenu.locator=//a[@href='/customers']
addcustomer.manage.locator=//button[contains(.,'Manage')]
addcustomer.addbutton.locator=//li[@title='Create New Customer']
addcustomer.name.locator=LeadName
addcustomer.email.locator=Email
addcustomer.phone.locator=MobileNo
addcustomer.save.locator=//button[contains(.,'Save')]
# Success is verified by the new customer's name appearing in the table below
# (no distinct toast/popup was reliably observed after Save)
addcustomer.success.locator=//table